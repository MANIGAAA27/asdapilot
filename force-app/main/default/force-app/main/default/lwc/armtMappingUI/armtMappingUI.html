<!-- armtMappingUI — User interface for mapping source CPQ fields to ARM targets -->
<template>
    <lightning-card title="CPQ to ARM Field Mapping" icon-name="standard:field_service_settings">
        <div class="slds-p-around_medium">

            <!-- Toolbar -->
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input
                        type="search"
                        label="Search Fields"
                        placeholder="Search by source or target field name..."
                        value={searchTerm}
                        onchange={handleSearchChange}>
                    </lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <lightning-combobox
                        name="confidenceFilter"
                        label="Confidence"
                        value={selectedConfidence}
                        placeholder="All"
                        options={confidenceOptions}
                        onchange={handleConfidenceFilterChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-align-bottom">
                    <lightning-button
                        variant="brand"
                        label="Save Mappings"
                        icon-name="utility:save"
                        onclick={handleSaveMappings}
                        disabled={isSaving}>
                    </lightning-button>
                </div>
            </div>

            <!-- Loading state -->
            <template if:true={isLoading}>
                <lightning-spinner
                    alternative-text="Loading field mappings..."
                    size="medium">
                </lightning-spinner>
            </template>

            <!-- Error banner -->
            <template if:true={hasError}>
                <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <p>{errorMessage}</p>
                </div>
            </template>

            <!-- Success banner -->
            <template if:true={hasSaveSuccess}>
                <div class="slds-notify slds-notify_alert slds-theme_success slds-m-bottom_medium" role="status">
                    <span class="slds-assistive-text">Success</span>
                    <p>Mappings saved successfully.</p>
                </div>
            </template>

            <!-- Mapping table -->
            <template if:false={isLoading}>
                <template if:true={hasMappings}>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col">
                                    <div class="slds-truncate" title="Source Field">Source Field (CPQ)</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate" title="Target Field">Target Field (ARM)</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate" title="Confidence">Confidence</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate" title="Actions">Actions</div>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={filteredMappings} for:item="mapping">
                                <tr key={mapping.id}>
                                    <td>
                                        <div class="slds-truncate" title={mapping.sourceFieldApi}>
                                            {mapping.sourceFieldApi}
                                        </div>
                                    </td>
                                    <td>
                                        <lightning-input
                                            type="text"
                                            value={mapping.targetFieldApi}
                                            data-id={mapping.id}
                                            label=""
                                            variant="label-hidden"
                                            onchange={handleTargetFieldChange}>
                                        </lightning-input>
                                    </td>
                                    <td>
                                        <lightning-badge
                                            label={mapping.confidenceLabel}
                                            class={mapping.confidenceClass}>
                                        </lightning-badge>
                                    </td>
                                    <td>
                                        <lightning-button-icon
                                            icon-name="utility:delete"
                                            alternative-text="Remove mapping"
                                            title="Remove mapping"
                                            data-id={mapping.id}
                                            onclick={handleRemoveMapping}>
                                        </lightning-button-icon>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template if:false={hasMappings}>
                    <div class="slds-illustration slds-illustration_small slds-p-around_large">
                        <p class="slds-text-body_regular slds-text-color_weak">
                            No field mappings available. Run a CPQ scan to generate mapping suggestions.
                        </p>
                    </div>
                </template>
            </template>

        </div>
    </lightning-card>
</template>
