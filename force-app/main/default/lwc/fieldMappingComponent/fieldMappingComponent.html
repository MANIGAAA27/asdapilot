<template>
    <div class="slds-form slds-form_stacked">
        <template if:true={sectionTitle}>
            <h4 class="slds-text-heading_small slds-m-bottom_small">{sectionTitle}</h4>
        </template>
        <div class="slds-grid slds-wrap">
            <template for:each={fields} for:item="field">
                <div key={field.key} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-right_small slds-m-bottom_small">
                    <lightning-input
                        key={field.key}
                        data-field-key={field.key}
                        label={field.label}
                        type={field.type}
                        value={field.currentValue}
                        required={field.required}
                        onchange={handleFieldChange}>
                    </lightning-input>
                </div>
            </template>
        </div>
    </div>
</template>
